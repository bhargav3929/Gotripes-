name: Deploy to Production

# Every push to main deploys gotrips.ai by running deploy.sh on the server
# over SSH; once a day the same key runs a read-only check. A failure in
# either shows as a red X here and GitHub emails about it.
#
# The key in DEPLOY_SSH_KEY can do nothing else: the server's
# authorized_keys pins it to deploy-entry.sh, which only accepts
# "deploy" or "check". See docs/DEPLOYING.md.
#
# Until 21 Oct 2026 this workflow uploaded the repository over FTP. That
# made every file briefly vanish for ~15 minutes per push, ran migrations
# through a public PHP script, and left the server's git copy so out of
# date that every real deploy failed for two months.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'   # daily drift check, 08:30 Dubai
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy or check'
        required: true
        default: check
        type: choice
        options: [check, deploy]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of 145.79.212.28:65002 (checked 21 Oct 2026).
          echo '[145.79.212.28]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJFZJ7Qvs407ipubqGvGoHUpvDh8A+8oPNlEj9KPtZC2' > ~/.ssh/known_hosts

      - name: ${{ (github.event_name == 'push' || inputs.action == 'deploy') && 'Deploy' || 'Check the server matches GitHub' }}
        run: |
          ACTION=check
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.action }}" = "deploy" ]; then ACTION=deploy; fi
          ssh -i ~/.ssh/deploy_key -p 65002 -o BatchMode=yes -o StrictHostKeyChecking=yes \
              u705168859@145.79.212.28 "$ACTION"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

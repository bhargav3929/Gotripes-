    (() => {
      const root = document.querySelector('[data-composition-id="08-ready-to-travel"]');
      const cardInstalled = root.querySelector('[id="08-ready-to-travel-card-installed"]');
      const cardConnected = root.querySelector('[id="08-ready-to-travel-card-connected"]');
      const cardFinal = root.querySelector('[id="08-ready-to-travel-card-final"]');
      const finalState = root.querySelector('[id="08-ready-to-travel-final-state"]');
      const lockup = root.querySelector('[id="08-ready-to-travel-lockup"]');
      const checkPath = root.querySelector('[id="08-ready-to-travel-check-path"]');
      const signalPaths = [
        root.querySelector('[id="08-ready-to-travel-signal-one"]'),
        root.querySelector('[id="08-ready-to-travel-signal-two"]'),
        root.querySelector('[id="08-ready-to-travel-signal-three"]'),
        root.querySelector('[id="08-ready-to-travel-signal-four"]')
      ];

      [checkPath, ...signalPaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["08-ready-to-travel"] = tl;

      tl.set([cardInstalled, cardConnected, cardFinal], { autoAlpha: 0 }, 0);
      tl.set(cardInstalled, { autoAlpha: 1 }, 0);
      tl.to(checkPath, {
        strokeDashoffset: 0,
        duration: 0.62,
        ease: "power2.out"
      }, 0.16);

      tl.set(cardInstalled, { autoAlpha: 0 }, 1.5);
      tl.set(cardConnected, { autoAlpha: 1 }, 1.5);
      signalPaths.forEach((path, index) => {
        tl.to(path, {
          strokeDashoffset: 0,
          duration: index === signalPaths.length - 1 ? 0.38 : 0.5,
          ease: "power2.out"
        }, 1.58 + index * 0.36);
      });

      tl.set(cardConnected, { autoAlpha: 0 }, 3.0);
      tl.set(cardFinal, { autoAlpha: 1 }, 3.0);
      tl.fromTo(finalState,
        { y: 18, scale: 0.99, opacity: 1 },
        { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        3.0
      );

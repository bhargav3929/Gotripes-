      window.__timelines = window.__timelines || {};

      const wordNodes = byClass("word");

        plan.push({ node, start, duration });
        return plan;

      tl.set([byId("qr"), byId("phone")], { opacity: 0 }, 0);

        tl.fromTo(
          node,
          { y: 70, opacity: 0, scale: 0.9 },
          { y: 0, opacity: 1, scale: 1, duration, ease: "power4.out" },
          start,
        );
        if (index === 1) {
          tl.fromTo(
            byId("qr-echo"),
            { x: -28, opacity: 0 },
            { x: 0, opacity: 0.2, duration: 0.46, ease: "power3.out" },
            start + 0.08,
          );
        }
      });

      tl.to(byId("seed-title"), { x: -88, y: -20, duration: 0.34, ease: "power4.in" }, 1.16);
      tl.to(byId("qr-echo"), { x: -230, opacity: 0, duration: 0.34, ease: "power4.in" }, 1.16);

      byClass("burst-item").forEach((el, index) => {

          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.58, opacity: 0 },
          {
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 1.45,
            ease: "power3.out",
          },
          1.5 + index * 0.06,
        );
      });

      tl.fromTo(
        byId("progress-fill"),
        { scaleX: 0 },
        { scaleX: 1, duration: 1.05, ease: "power2.out" },
        2.82,
      );

      tl.to(byId("seed-title"), { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 4.1);
      tl.to(byId("seed-title"), { opacity: 0.15, duration: 0.2, ease: "none" }, 4.1);
      tl.set(byId("seed-title"), { opacity: 0 }, 4.3);
      tl.set(byId("payoff"), { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, 4.3);

        byId("payoff"),

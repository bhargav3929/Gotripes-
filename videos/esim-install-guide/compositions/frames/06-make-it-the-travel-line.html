      const root = document.querySelector('[data-composition-id="06-make-it-the-travel-line"]');
      if (!root) return;

      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      });

      const railPath = q(".f06-make-it-the-travel-line-rail-live");
      const railLength = railPath.getTotalLength();
      railPath.style.strokeDasharray = `${railLength}`;
      railPath.style.strokeDashoffset = `${railLength}`;

      tl.fromTo(
        "#f06-make-it-the-travel-line-status",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        "#f06-make-it-the-travel-line-profile",
        { opacity: 0, y: 42, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "back.out(1.4)" },
        0.12
      );
      tl.fromTo(
        ".f06-make-it-the-travel-line-phone",
        { opacity: 0, x: 80 },
        { opacity: 0.72, x: 0, duration: 0.65, ease: "power3.out" },
        0.2
      );

      const nameStates = [
        { t: 0.0, text: "Secondary" },
        { t: 0.42, text: "Second" },
        { t: 0.58, text: "Sec" },
        { t: 0.76, text: "" },
        { t: 0.93, text: "Tr" },
        { t: 1.08, text: "Trav" },
        { t: 1.24, text: "Travel" }
      ];
      const nameAt = (time) => {
        for (let i = nameStates.length - 1; i >= 0; i -= 1) {
          if (time >= nameStates[i].t) return nameStates[i].text;
        }
        return "Secondary";
      };
      const nameDriver = { t: 0 };
      tl.to(nameDriver, {
        t: 1.35,
        duration: 1.35,
        ease: "none",
        onUpdate: () => { q("#f06-make-it-the-travel-line-profile-name").textContent = nameAt(nameDriver.t); }

      const caretDriver = { p: 0 };

        p: Math.PI * 6,
        duration: 1.65,
        ease: "none",
        onUpdate: () => { q("#f06-make-it-the-travel-line-caret").style.opacity = Math.sin(caretDriver.p) > 0 ? "1" : "0"; }

      tl.fromTo(

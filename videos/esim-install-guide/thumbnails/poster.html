<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eSIM install guide poster</title>
<!-- Poster frames for the two install videos on /esim.
     ?v=main  -> iPhone + Android guide
     ?v=android -> Android-only guide
     Render at 1920x1080 and save as JPG (see README in this folder). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#080706; --ink-2:#1A1A18; --gold:#D4AF37; --cream:#F4EBD0; --hair:#282826; --muted:#8C897F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; background:var(--ink); overflow:hidden; }
  body { font-family:"Barlow", system-ui, sans-serif; color:var(--cream); position:relative; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; font-weight:500; letter-spacing:.14em; text-transform:uppercase; }
  .rule { position:absolute; left:105px; right:105px; height:1px; background:var(--hair); }
  .rule.t { top:46px; } .rule.b { bottom:112px; }
  .cat { position:absolute; top:17px; font-size:14px; color:var(--gold); }
  .cat.l { left:105px; } .cat.r { right:105px; }

  .copy { position:absolute; left:105px; top:170px; width:1000px; }
  .kick { font-size:20px; color:var(--gold); margin-bottom:34px; }
  h1 { font-weight:900; font-size:190px; line-height:.88; letter-spacing:-.03em; }
  h1 em { font-style:normal; color:var(--gold); }
  .sub { margin-top:44px; font-size:50px; line-height:1.1; font-weight:600; letter-spacing:-.02em; color:var(--cream); }
  .chips { margin-top:54px; display:flex; gap:14px; }
  .chip { border:1px solid var(--gold); color:var(--gold); padding:14px 22px; font-size:18px; }
  .chip.solid { background:var(--gold); color:var(--ink); }

  .phone { position:absolute; left:1250px; top:130px; width:480px; height:690px; border:2px solid var(--gold); background:var(--ink-2); }
  .phone .cap { height:92px; padding:46px 28px 0; display:flex; justify-content:space-between; font-size:14px; color:var(--gold); border-bottom:1px solid var(--hair); }
  .phone .cap span:last-child { color:var(--muted); }
  .phone .foot { position:absolute; left:0; right:0; bottom:0; height:44px; border-top:1px solid var(--hair); display:flex; gap:12px; justify-content:center; align-items:center; }
  .phone .foot i { width:9px; height:9px; border:1px solid var(--muted); border-radius:50%; }
  .phone .foot i:nth-child(2) { background:var(--gold); border-color:var(--gold); }
  .qr { position:absolute; left:120px; top:150px; width:240px; height:240px; border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; }
  .qr svg { width:130px; height:130px; }
  .qr svg path { fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:square; }
  .qr svg rect { fill:var(--gold); }
  .rowtxt { position:absolute; left:40px; right:40px; border-top:1px solid var(--hair); padding-top:18px; font-size:30px; font-weight:700; letter-spacing:-.02em; }
  .rowtxt.a { top:420px; color:var(--gold); border-top-color:var(--gold); }
  .rowtxt.b { top:520px; color:var(--cream); }
  .rowtxt small { display:block; margin-bottom:8px; font-size:12px; color:var(--muted); }

  .play { position:absolute; left:1250px; top:130px; width:480px; height:690px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:64px; pointer-events:none; }
  .play div { width:132px; height:132px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 14px rgba(212,175,55,.16); }
  .play svg { width:46px; height:46px; margin-left:8px; }

  .brand { position:absolute; left:105px; bottom:150px; display:flex; align-items:center; gap:18px; font-size:15px; color:var(--cream); }
  .brand img { width:64px; height:64px; border-radius:50%; }
  .len { position:absolute; right:105px; bottom:158px; font-size:15px; color:var(--muted); }
</style>
</head>
<body>
<div class="rule t"></div><div class="rule b"></div>
<div class="mono cat l" id="cat"></div><div class="mono cat r">gotrips.ai / esim</div>

<div class="copy">
  <div class="mono kick" id="kick"></div>
  <h1 id="h1"></h1>
  <div class="sub" id="sub"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="phone">
  <div class="mono cap"><span id="pcap"></span><span>09:41</span></div>
  <div class="qr"><svg viewBox="0 0 132 132" aria-hidden="true"><path d="M10 48 V10 H48"/><path d="M84 10 H122 V48"/><path d="M122 84 V122 H84"/><path d="M48 122 H10 V84"/><rect x="43" y="43" width="17" height="17"/><rect x="72" y="43" width="17" height="17"/><rect x="43" y="72" width="17" height="17"/><rect x="72" y="72" width="17" height="17"/></svg></div>
  <div class="rowtxt a"><small class="mono" id="rk"></small><span id="ra"></span></div>
    <div class="foot"><i></i><i></i><i></i></div>
</div>
<div class="play"><div><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="#080706"/></svg></div></div>

<div class="brand mono"><img src="../assets/brand/logo.png" alt=""><span>GoTrips &nbsp;/&nbsp; install guide</span></div>
<div class="mono len" id="len"></div>

<script>
  const v = new URLSearchParams(location.search).get('v') || 'main';
  const set = (id, h) => document.getElementById(id).innerHTML = h;
  if (v === 'android') {
    set('cat', 'Android / install guide');
    set('kick', 'Step by step · Pixel · Samsung Galaxy');
    set('h1', 'eSIM on<br><em>android.</em>');
    set('sub', 'Scan the QR, or type the code in by hand.');
    set('chips', '<span class="mono chip solid">Google Pixel</span><span class="mono chip">Samsung Galaxy</span><span class="mono chip">Enter code manually</span>');
    set('pcap', 'SIM manager'); set('rk', 'tap'); set('ra', 'add eSIM');
    set('len', '1:34 · watch before you fly');
  } else {
    set('cat', 'iPhone + Android / install guide');
    set('kick', 'Before you fly · About two minutes');
    set('h1', 'install your<br><em>eSIM.</em>');
    set('sub', 'The whole setup, on iPhone and Android.');
    set('chips', '<span class="mono chip solid">iPhone</span><span class="mono chip solid">Android</span><span class="mono chip">Same-phone QR</span>');
    set('pcap', 'Settings'); set('rk', 'tap'); set('ra', 'add eSIM');
    set('len', '1:24 · watch before you fly');
  }
</script>
</body>
</html>
